services:
  ingparser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingparser
    working_dir: /app
    # Keep an interactive TTY open so "docker compose exec" feels nice
    tty: true
    stdin_open: true
    volumes:
      - ./data:/app/data:rw
    # If you need network access to fetch wheels, leave this as default
    # networks: [default]
    # environment:
    #   - YOUR_ENV=value
  viewer:
    image: datasetteproject/datasette
    command: [
      "datasette", "serve",
      "--immutable", "/data/bank.sqlite3",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--setting", "sql_time_limit_ms", "3000",
      "--setting", "allow_download", "on",
      "--metadata", "/data/metadata.yaml"
    ]
    ports:
      - "8123:8000"
    volumes:
      - ./data:/data:ro   # read-only mount der DB + metadata

